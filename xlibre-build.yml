name: Track, Build, and Package XLibre

on:
  schedule:
    - cron: '0 0 */12 * *'
  workflow_dispatch:

jobs:
  check-and-build:
    runs-on: ubuntu-latest

    steps:
    - name: Fetch Latest Commit Hash
      id: get_hash
      run: |
        HASH=$(git ls-remote https://github.com HEAD | awk '{print $1}')
        echo "LATEST_HASH=$HASH" >> $GITHUB_ENV
        echo "SHORT_HASH=${HASH:0:7}" >> $GITHUB_ENV

    - name: Checkout Automation Repository
      uses: actions/checkout@v4

    - name: Checkout XLibre
      uses: actions/checkout@v4
      with:
        repository: 'X11Libre/xserver'
        ref: ${{ env.LATEST_HASH }}
        path: xsource

    - name: Install Build Tools & Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y meson ninja-build build-essential xorg-dev libx11-dev libxext-dev libxrender-dev libxi-dev

    - name: Install NFPM
      run: |
        echo 'deb [trusted=yes] https://goreleaser.com /' | sudo tee /etc/apt/sources.list.d/goreleaser.list
        sudo apt-get update
        sudo apt-get install -y nfpm

    - name: Configure and Compile
      run: |
        meson setup build/ xsource/ --buildtype=release --prefix=/usr
        meson compile -C build/
        DESTDIR=$PWD/dist meson install -C build/

    # The metadata tells APT and DNF to pull core runtime libraries, 
    # but forcefully conflict with and substitute the native xserver-xorg stack.
    - name: Create NFPM Configuration
      run: |
        cat <<EOF > nfpm.yaml
        name: "xlibre"
        arch: "amd64"
        platform: "linux"
        version: "1.0.0-${{ env.SHORT_HASH }}"
        section: "x11"
        priority: "optional"
        maintainer: "Shantil-K <automation@github.com>"
        description: "Automated independent build of XLibre Xserver."
        homepage: "https://github.com"
        license: "MIT"
        
        depends:
          - libc6
          - libx11-6
          - libxext6
          - libxrender1
          - libxi6
          
        conflicts:
          - xserver-xorg
          - xserver-xorg-core
          
        replaces:
          - xserver-xorg
          - xserver-xorg-core
          
        provides:
          - xserver-xorg
          - xserver-xorg-core

        contents:
          - src: ./dist/usr/bin/*
            dst: /usr/bin/
          - src: ./dist/usr/lib/*
            dst: /usr/lib/
        EOF

    # Generate the custom deb and rpm packages
    - name: Generate Packages
      run: |
        nfpm package --config nfpm.yaml --target xlibre_${{ env.SHORT_HASH }}.deb
        nfpm package --config nfpm.yaml --target xlibre-${{ env.SHORT_HASH }}.x86_64.rpm
        tar -czvf xlibre-${{ env.SHORT_HASH }}.tar.gz -C dist/usr .

    - name: Publish Build to Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: xlibre-${{ env.SHORT_HASH }}
        name: XLibre Conflict-Free Build (${{ env.SHORT_HASH }})
        body: |
          Automated multi-package compilation of XLibre Xserver.
          Built from upstream commit: https://github.com/commit/${{ env.LATEST_HASH }}
          *Automatically replaces standard xserver-xorg package sets.*
        files: |
          xlibre_${{ env.SHORT_HASH }}.deb
          xlibre-${{ env.SHORT_HASH }}.x86_64.rpm
          xlibre-${{ env.SHORT_HASH }}.tar.gz
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
